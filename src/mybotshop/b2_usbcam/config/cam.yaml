/**:
  b2_usbcam_f:
    ros__parameters:
      video_device: "/dev/video0"
      framerate: 30.0
      io_method: "mmap"
      frame_id: "usb_cam_front_link"
      pixel_format: "mjpeg2rgb" 
      av_device_format: "YUV422P"
      image_width: 2048
      image_height: 1536
      camera_name: "usb_camera"
      camera_info_url: "package://b2_usbcam/config/camera_calibration_f.yaml"
      brightness: -1
      contrast: -1
      saturation: -1
      sharpness: -1
      gain: -1
      auto_white_balance: true
      white_balance: 4000
      autoexposure: true
      exposure: 100
      autofocus: false
      focus: -1