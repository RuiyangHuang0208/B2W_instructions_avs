<html>

<head>
    <title>VNC - Robot Webserver</title>
    <link rel="icon" href="../static/media/logos/mbs_logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="../static/styles.css" type="text/css" />
    <script src="../static/scripts/common_script.js" defer></script>
    <script type="module" src="../static/scripts/vnc_script.js" defer></script>
</head>

<body>
    <!-- Navbar -->
    <div class="navbar"></div>

    <!-- Background Media -->
    <div class="background-media">
        <img src="../static/media/wallpaper/wallpaper.webp" alt="Background GIF">
    </div>

    <!-- Main Panels -->
    <div class="container">
        <!-- VNC Viewer Container -->
        <div class="vnc-container">
            <div id="vnc-status">Disconnected</div>
            <div id="vnc-screen"></div>
            <div class="vnc-controls">
                VNC Host:<input type="text" id="vnc-host" value="192.168.123.164" placeholder="192.168.123.164">
                Websocket Port:<input type="text" id="vnc-port" value="6080" placeholder="6080">
                VNC Password:<input type="password" id="vnc-password" value="mybotshop" placeholder="mybotshop">
                <button id="vnc-connect-btn">Connect</button>
                <button id="vnc-disconnect-btn">Disconnect</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer_"></div>
</body>

</html>
