<head>
    <title>System - Robot Webserver</title>
    <link rel="icon" href="../static/media/logos/mbs_logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="../static/styles.css" type="text/css" />
    <script src="../static/scripts/common_script.js" defer></script>
    <script src="../static/scripts/system_script.js" defer></script>
    <script type="module" src="../static/scripts/model_scripts.js" defer></script>
    <script type="module" src="../static/scripts/chart.min.js"></script>
</head>

<body>
    <div class="navbar"></div>

    <div class="container">
        <!-- Background Media -->
        <div class="background-media">
            <img src="../static/media/wallpaper/wallpaper.webp" alt="Background">
        </div>

        <!-- Main Panels -->
        <div class="panel-container">

            <!-- Info Board -->
            <div class="panel system-panel">
                <h2>System <span style="color: var(--project-color);">Information</span></h2>
                <hr class="heading-line">

                <h3>System <span style="color: var(--project-color);">Panel</span></h3>
                <div id="systemInfo">Fetching system status...</div>
            </div>

            <!-- System Health Status -->
            <div class="panel system-panel">
                <h2>
                    <div class="loading">
                        <svg width="60px" height="44px">
                            <polyline points="0.157 23.954, 14 23.954, 21.843 44, 43 0, 50 24, 60 24" id="back">
                            </polyline>
                            <polyline points="0.157 23.954, 14 23.954, 21.843 44, 43 0, 50 24, 60 24" id="front">
                            </polyline>
                        </svg>
                    </div>Health <span style="color: var(--project-color);">Alerts</span>
                </h2>
                <hr class="heading-line">

                <!-- Battery Status -->
                <h3>Battery <span style="color: var(--project-color);">Status</span></h3>
                <div class="battery-status-container">
                    <div class="battery-visual">
                        <div class="battery-terminal"></div>
                        <div class="battery-body">
                            <div class="battery-level" id="batteryLevel">
                                <div class="battery-wave"></div>
                                <div class="battery-wave"></div>
                                <div class="battery-wave"></div>
                            </div>
                        </div>
                        <div class="battery-percentage" id="batteryPercentage">0%</div>
                    </div>

                    <div class="battery-details" id="batteryDetails">
                        <div class="detail-item">
                            <span class="detail-label">VOLTAGE</span>
                            <span class="detail-value" id="batteryVoltage">N/A</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">STATUS</span>
                            <span class="detail-value" id="batteryStatus">N/A</span>
                        </div>
                    </div>
                </div>
                <!-- /Battery Status -->

                <!-- Health Alerts -->
                <h3>System <span style="color: var(--project-color);">Status</span></h3>
                <div id="healthAlerts">Fetching health alerts...</div>
            </div>

            <!-- System Monitoring Graphs -->
            <div class="panel graphs-panel">
                <h2>System <span style="color: var(--project-color);">Monitoring</span></h2>
                <hr class="heading-line">

                <div class="graphs-container">
                    <div class="graph-item">
                        <div class="graph-title">CPU Usage</div>
                        <canvas id="cpuChart" class="graph-canvas"></canvas>
                    </div>

                    <div class="graph-item">
                        <div class="graph-title">Memory Usage</div>
                        <canvas id="memoryChart" class="graph-canvas"></canvas>
                    </div>

                    <div class="graph-item">
                        <div class="graph-title">Network Usage</div>
                        <canvas id="networkChart" class="graph-canvas"></canvas>
                    </div>

                    <div class="graph-item">
                        <div class="graph-title">CPU Temperature</div>
                        <canvas id="temperatureChart" class="graph-canvas"></canvas>
                    </div>
                </div>
            </div>
            <!-- /System Monitoring Graphs -->

        </div>
    </div>

    <!-- Footer -->
    <div class="footer_"></div>

</body>

</html>
